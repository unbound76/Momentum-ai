<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>Momentum — Daily Growth</title>
<style>
:root{--bg:#090b10;--panel:#151b26;--line:#293241;--text:#f3f5f8;--muted:#929bad;--accent:#b7f36b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1b2630,var(--bg) 55%);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0}.app{max-width:1100px;margin:auto;padding:20px 18px 95px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:-.5px}.logo{width:36px;height:36px;border-radius:12px;background:var(--accent);color:#10150b;display:grid;place-items:center;font-weight:950}.pill{background:#1c2430;border:1px solid var(--line);padding:7px 10px;border-radius:99px;color:var(--muted);font-size:11px}.tabs{display:flex;gap:6px;background:#111620;border:1px solid var(--line);padding:5px;border-radius:13px;width:max-content;margin-bottom:25px}.tab{background:none;color:var(--muted);padding:9px 16px;border-radius:9px;font-size:13px}.tab.active{background:#252e3a;color:white}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:15px;margin-top:20px}.card{background:linear-gradient(145deg,#151b26,#111620);border:1px solid var(--line);border-radius:18px;padding:19px;min-width:0}h1{font-size:30px;letter-spacing:-1px;margin:0 0 5px}h2{font-size:17px;margin:0 0 13px}h3{font-size:14px;margin:0 0 5px}.muted,.sub{color:var(--muted)}.sub{margin:0}.date{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:18px}.hero{display:flex;justify-content:space-between;align-items:center;gap:15px}.ring{width:98px;height:98px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--p),#29313e 0);position:relative;flex:none}.ring:before{content:"";position:absolute;inset:8px;border-radius:50%;background:#141a24}.ring b{position:relative;font-size:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.stat{background:#1a212d;border-radius:12px;padding:12px}.stat b{display:block;font-size:20px}.stat small{color:var(--muted);font-size:10px}.task{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #252d39}.task:last-child{border:0}.check{width:23px;height:23px;border:1px solid #526071;border-radius:8px;background:#171e29;flex:none}.check.done{background:var(--accent);color:#111;border-color:var(--accent)}.taskmain{flex:1;min-width:0}.taskmain b{font-size:13px;display:block}.taskmain small{font-size:11px;color:var(--muted)}.xp{font-size:11px;color:var(--accent)}.btn{background:var(--accent);color:#11170b;padding:10px 14px;border-radius:10px;font-weight:750;font-size:12px}.btn.secondary{background:#252e3a;color:#eef1f6;border:1px solid #354050}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.small{padding:7px 10px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.tag{font-size:10px;color:var(--accent);background:#293721;padding:5px 8px;border-radius:99px}.bar{height:8px;background:#2a3340;border-radius:20px;overflow:hidden;margin:10px 0}.bar span{height:100%;display:block;background:var(--accent)}.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tool{background:#1a212d;border:1px solid #2a3442;border-radius:14px;padding:15px;text-align:left;min-height:105px}.tool p{font-size:11px;color:var(--muted);margin:4px 0}.tool strong{font-size:13px}.field{width:100%;background:#0e131c;color:white;border:1px solid #303a49;border-radius:10px;padding:11px;outline:none}.field:focus{border-color:#91bc54}.label{font-size:11px;color:var(--muted);display:block;margin:10px 0 5px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{display:grid;gap:9px}.item{background:#1a212d;border-radius:12px;padding:13px;display:flex;justify-content:space-between;gap:10px}.timer{font-size:54px;font-weight:850;text-align:center;letter-spacing:-2px;margin:20px}.center{text-align:center}.coach{background:#202936;border:1px solid #303c4d;border-radius:14px;padding:15px;white-space:pre-wrap;font-size:13px}.bottom{display:block;position:fixed;bottom:18px;right:16px;z-index:1000;width:58px;height:58px;padding:0;background:transparent;border:0}#bottom{display:block!important;position:fixed!important;right:16px!important;bottom:18px!important;left:auto!important;top:auto!important;width:58px!important;height:58px!important;z-index:2147483647!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important}#bottom .menu-toggle{display:grid!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important}.menu-toggle{display:grid;width:58px;height:58px;place-items:center;border-radius:17px;background:var(--accent);color:#11170b;font-size:25px;box-shadow:0 6px 24px #0008;border:0;cursor:pointer}.bottom-menu{display:none;position:absolute;right:0;bottom:70px;width:min(310px,calc(100vw - 32px));padding:12px;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;background:#111823;border:1px solid var(--line);border-radius:17px;box-shadow:0 12px 35px #0009}.bottom.open .bottom-menu{display:grid}.bottom-menu button{min-height:76px;padding:10px 4px;border-radius:12px;background:#1a2330;border:1px solid #2b3747;color:var(--muted);font-size:11px;display:grid;gap:5px;align-content:center;justify-items:center}.bottom-menu button.active{color:var(--accent);border-color:#789c48;background:#202b1a}.bottom-menu i{font-style:normal;font-size:21px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#e6f9c9;color:#18200e;padding:10px 15px;border-radius:11px;font-weight:700;font-size:12px;opacity:0;transition:.2s}.toast.show{opacity:1}
@media(max-width:700px){.app{padding:15px 13px 35px}.tabs{display:none}.grid{grid-template-columns:1fr}.head{align-items:flex-start}.ring{width:85px;height:85px}.stat{padding:9px}.stat b{font-size:17px}.bottom{display:block;position:fixed;bottom:18px;right:16px;left:auto;z-index:10;width:58px;height:58px;padding:0;background:transparent;border:0}.menu-toggle{display:grid;width:58px;height:58px;place-items:center;border-radius:17px;background:var(--accent);color:#11170b;font-size:25px;box-shadow:0 6px 24px #0008}.bottom-menu{display:none;position:absolute;right:0;bottom:70px;width:min(310px,calc(100vw - 32px));padding:12px;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;background:#111823;border:1px solid var(--line);border-radius:17px;box-shadow:0 12px 35px #0009}.bottom.open .bottom-menu{display:grid}.bottom-menu button{min-height:76px;padding:10px 4px;border-radius:12px;background:#1a2330;border:1px solid #2b3747;color:var(--muted);font-size:11px;display:grid;gap:5px;align-content:center;justify-items:center}.bottom-menu button.active{color:var(--accent);border-color:#789c48;background:#202b1a}.bottom-menu i{font-style:normal;font-size:21px}.formrow{grid-template-columns:1fr}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">M</div>MOMENTUM</div><div style="display:flex;gap:8px;align-items:center"><span class="pill" id="saveState">✓ Saved on device</span><span class="pill" id="streak">🔥 0 day streak</span></div></header><nav class="tabs" id="tabs"></nav><main id="main"></main></div><nav class="bottom" id="bottom"></nav><div class="toast" id="toast"></div>
<script>
const KEY='momentum_pages_v1',defaults={todos:[],xp:0,level:1,streak:0,tasks:[{id:1,title:'Plan your day',detail:'Set your priorities',xp:20,done:false},{id:2,title:'Move your body',detail:'Choose movement you enjoy',xp:30,done:false},{id:3,title:'Practice a skill',detail:'Spend 15 minutes learning',xp:25,done:false},{id:4,title:'Evening reflection',detail:'Write down one win',xp:20,done:false}],workouts:[],focusSessions:0,focusMinutes:25,coachNotes:[]};
let data;try{data={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data={...defaults}}let page='plan',timer=null,seconds=data.focusMinutes*60;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));let e=document.getElementById('saveState');if(e)e.textContent='✓ Saved on device'}catch{let e=document.getElementById('saveState');if(e)e.textContent='Save unavailable'}}
function notify(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1700)}
function xp(n){data.xp+=n;while(data.xp>=data.level*100){data.xp-=data.level*100;data.level++;notify('Level up! Level '+data.level)}}
function go(p){if(timer){clearInterval(timer);timer=null}page=p;render()}
function head(t,s,a=''){return '<div class="head"><div><div class="date">'+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+'</div><h1>'+t+'</h1><p class="sub">'+s+'</p></div>'+a+'</div>'}
function plan(){let n=data.tasks.filter(t=>t.done).length,p=data.tasks.length?Math.round(n/data.tasks.length*100):0;return head('Your daily plan','Small wins. Consistent progress.')+'<div class="grid"><section class="card"><div class="hero"><div><span class="tag">TODAY\'S FOCUS</span><h2 style="font-size:22px;margin:12px 0 5px">Keep your momentum.</h2><p class="muted" style="font-size:12px">Complete your plan one step at a time.</p></div><div class="ring" style="--p:'+p*3.6+'deg"><b>'+p+'%</b></div></div><div class="stats"><div class="stat"><b>'+n+'/'+data.tasks.length+'</b><small>Tasks done</small></div><div class="stat"><b>'+data.level+'</b><small>Level</small></div><div class="stat"><b>'+data.xp+'</b><small>XP</small></div></div></section><section class="card"><h2>Level progression</h2><b>'+(data.level*100-data.xp)+' XP</b><span class="muted" style="font-size:11px"> to next level</span><div class="bar"><span style="width:'+data.xp/data.level+'%"></span></div><small class="muted">Keep showing up. Progress adds up.</small></section><section class="card"><div class="sectionhead"><h2>Today\'s tasks</h2><button class="btn secondary small" id="addTask">＋ Add task</button></div>'+data.tasks.map(t=>'<div class="task"><button class="check '+(t.done?'done':'')+'" data-task="'+t.id+'">'+(t.done?'✓':'')+'</button><div class="taskmain"><b>'+safe(t.title)+'</b><small>'+safe(t.detail)+'</small></div><span class="xp">+'+t.xp+' XP</span></div>').join('')+'</section><section class="card"><h2>Your toolkit</h2><div class="tools"><button class="tool" data-go="workout">🏃<br><strong>Workout log</strong><p>Record a session</p></button><button class="tool" data-go="focus">◷<br><strong>Focus timer</strong><p>Make time to concentrate</p></button><button class="tool" data-go="coach">✦<br><strong>AI-style coach</strong><p>Get a practical next step</p></button><button class="tool" id="habit">✓<br><strong>Build a habit</strong><p>Add a routine to your plan</p></button></div></section></div>'}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function todo(){
 if(!Array.isArray(data.todos))data.todos=[];
 const pending=data.todos.filter(t=>!t.done),completed=data.todos.filter(t=>t.done);
 const item=t=>'<div class="task"><button class="check '+(t.done?'done':'')+'" data-todo-toggle="'+t.id+'">'+(t.done?'✓':'')+'</button><div class="taskmain"><b style="'+(t.done?'text-decoration:line-through;opacity:.6':'')+'">'+safe(t.title)+'</b><small>'+(t.date?'Due '+safe(t.date):'No due date')+'</small></div><button class="btn ghost small" data-todo-delete="'+t.id+'">Delete</button></div>';
 return head('To-do list','Keep track of the things you need to get done.')+
 '<section class="card" style="margin-bottom:15px"><div class="sectionhead"><h2>Reminder settings</h2><span class="tag">NOTIFICATIONS</span></div><label class="label">Daily reminder time</label><input class="field" id="todoReminderTime" type="time" value="'+safe(data.todoReminderTime||'18:00')+'"><p class="muted" style="font-size:11px;margin:8px 0 12px">Get a reminder about unfinished tasks at this time while Momentum is open.</p><button class="btn" id="enableTodoNotifications" style="width:100%">'+(data.todoNotifications?'Notifications enabled · Check permission':'Enable notifications')+'</button><p class="muted" style="font-size:10px;margin-top:10px">Due-date and daily reminders work while this app is open. Background notifications when the app is closed need a push-notification server.</p></section>'+
 '<section class="card"><h2>Add a task</h2><div class="formrow"><div><label class="label">What do you need to do?</label><input class="field" id="todoTitle" placeholder="e.g. Finish science homework"></div><div><label class="label">Due date (optional)</label><input class="field" id="todoDate" type="date"></div></div><br><button class="btn" id="addTodo" style="width:100%">＋ Add to list</button></section>'+
 '<section class="card" style="margin-top:15px"><div class="sectionhead"><h2>To do</h2><span class="tag">'+pending.length+' LEFT</span></div>'+(pending.length?pending.map(item).join(''):'<p class="muted">Nothing pending. Add a task whenever you need one.</p>')+'</section>'+
 '<section class="card" style="margin-top:15px"><div class="sectionhead"><h2>Completed</h2><span class="tag">'+completed.length+' DONE</span></div>'+(completed.length?completed.map(item).join(''):'<p class="muted">Completed tasks will show up here.</p>')+'</section>';
}
function workout(){return head('Workout','Your generated routine appears here automatically.')+(data.workoutPlan?'<section class="card" style="margin-bottom:15px"><div class="sectionhead"><h2>My workout plan</h2><span class="tag">FROM BUILDER</span></div><div class="coach">'+safe(data.workoutPlan.text).replace(/\n/g,'<br>')+'</div><div class="muted" style="font-size:10px;margin-top:8px">Added '+safe(data.workoutPlan.date||'')+'</div><button class="btn ghost small" id="removeWorkoutPlan" style="margin-top:10px">Remove plan</button></section>':'<section class="card" style="margin-bottom:15px"><h2>No workout plan yet</h2><p class="muted">Open Builder, generate a workout routine, and it will be added here automatically.</p><button class="btn" data-go="builder">Open Builder</button></section>')+'<div class="grid"><section class="card"><div class="sectionhead"><h2>Workout history</h2><span class="tag">'+data.workouts.length+' SESSIONS</span></div>'+(data.workouts.length?'<div class="list">'+data.workouts.slice().reverse().map(w=>'<div class="item"><div><b>'+safe(w.name)+'</b><div class="muted" style="font-size:11px">'+safe(w.date)+' · '+w.sets+' sets</div></div><b style="color:var(--accent)">'+w.minutes+' min</b></div>').join('')+'</div>':'<p class="muted">Your workouts will appear here after your first session.</p>')+'</section><section class="card"><h2>Log a session</h2><label class="label">Workout name</label><input class="field" id="wname" placeholder="Full body, basketball, run..."><div class="formrow"><div><label class="label">Sets / activities</label><input class="field" id="wsets" type="number" min="1" value="3"></div><div><label class="label">Minutes</label><input class="field" id="wmins" type="number" min="1" value="30"></div></div><br><button class="btn" id="saveWorkout" style="width:100%">Save workout</button></section></div>'}
function focus(){return head('Focus mode','Give one thing your full attention.')+'<div class="grid"><section class="card center"><span class="tag">FOCUS SESSION</span><div class="timer" id="clock">'+fmt(seconds)+'</div><p class="muted">Ready when you are.</p><button class="btn" id="toggle">Start focus</button> <button class="btn secondary" id="reset">Reset</button><div style="margin-top:18px">'+[15,25,45].map(m=>'<button class="btn ghost small" data-min="'+m+'">'+m+' min</button> ').join('')+'</div></section><section class="card"><h2>Focus stats</h2><div class="stats"><div class="stat"><b>'+data.focusSessions+'</b><small>Sessions</small></div><div class="stat"><b>'+data.focusMinutes+'</b><small>Timer length</small></div><div class="stat"><b>'+data.focusSessions*data.focusMinutes+'</b><small>Minutes focused</small></div></div><p class="muted" style="font-size:12px">Choose one small task, silence notifications, and take a break when you are done. This timer cannot block other apps.</p></section></div>'}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function builder(){
 const saved=data.generatedPlan||null;
 return head('Workout builder','Build a simple movement routine.')+
 '<section class="card"><div class="sectionhead"><h2>Build a workout plan</h2><span class="tag">MOMENTUM BUILDER</span></div>'+
 '<div class="formrow"><div><label class="label">Experience</label><select class="field" id="buildLevel"><option value="beginner">Beginner</option><option value="some">Some experience</option></select></div><div><label class="label">Days per week</label><select class="field" id="buildDays"><option value="2">2 days</option><option value="3">3 days</option></select></div></div>'+
 '<label class="label">Equipment</label><select class="field" id="buildEquipment"><option value="bodyweight">No equipment</option><option value="light">Light home equipment</option></select>'+
 '<br><button class="btn" id="makePlan" style="width:100%">✦ Generate workout plan</button>'+
 '<p class="muted" style="font-size:10px;margin-top:12px">Offline planner · Creates a plan on this device; it is not a live AI model.</p></section>'+
 '<section class="card" id="generatedArea" style="margin-top:15px">'+(saved?'<h2>Your saved plan</h2><div class="coach">'+safe(saved.text).replace(/\n/g,'<br>')+'</div>':'<h2>Your plan will appear here</h2><p class="muted">Choose your preferences and generate a plan.</p>')+'</section>';
}
function buildPlan(){
 const days=+document.getElementById('buildDays').value;
 const level=document.getElementById('buildLevel').value;
 const gear=document.getElementById('buildEquipment').value;
 const sets=level==='beginner'?'1–2 comfortable sets':'2 comfortable sets';
 const push=gear==='light'?'Incline or light resistance-band rows, using equipment only if an adult has checked it is safe.':'Wall push-ups or incline push-ups against a sturdy surface.';
 const session='Warm up with 5 minutes of easy movement.\n• '+sets+' of chair/bodyweight squats.\n• '+sets+' of '+push+'\n• '+sets+' of bird-dogs, alternating sides.\n• Finish with easy walking and gentle movement.';
 const text='YOUR WEEKLY MOVEMENT PLAN\n\nDay 1 — Full-body basics\n'+session+'\n\n'+(days===3?'Day 2 — Enjoyable movement\nChoose a fun activity such as walking, cycling, dancing, or a sport at a comfortable pace.\n\n':'Day 2 — Rest or gentle movement\nTake a rest day or choose an easy walk or activity you enjoy.\n\n')+(days===3?'Day 3 — Full-body basics\nRepeat Day 1, focusing on comfortable technique rather than doing more.\n\n':'Day 3 — Rest\nGive your body time to recover.\n\n')+'Other days: rest or choose gentle movement you enjoy. Keep sessions comfortable, stop if something hurts, and ask a trusted adult or qualified coach to help check your form. Eat regular meals, drink water, and get enough sleep. This plan is for general wellbeing and strength—not changing your appearance. If you have an injury, health concern, or questions about growth, check with a parent/guardian and healthcare professional first.';
 data.generatedPlan={type:'workout',text,date:new Date().toLocaleDateString()};
 data.workoutPlan={text,date:data.generatedPlan.date};
 save();
 const area=document.getElementById('generatedArea');
 if(area)area.innerHTML='<h2>Your generated plan</h2><div class="coach">'+safe(text).replace(/\n/g,'<br>')+'</div><button class="btn secondary" id="copyPlan" style="margin-top:12px">Copy plan</button>';
 const cp=document.getElementById('copyPlan');
 if(cp)cp.onclick=()=>{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>notify('Plan copied')).catch(()=>notify('Copy is unavailable in this browser'))}else notify('Copy is unavailable in this browser')};
 notify('Your plan is ready');
}
function coach(){if(!Array.isArray(data.coachChat))data.coachChat=[];let chat=data.coachChat.length?data.coachChat.map(m=>'<div class="coach" style="margin:9px 0;border-color:'+(m.role==='you'?'#536b38':'#303c4d')+'"><b style="color:'+(m.role==='you'?'var(--accent)':'#dce5f2')+'">'+(m.role==='you'?'You':'Momentum Coach')+'</b><div style="margin-top:6px">'+safe(m.text).replace(/\n/g,'<br>')+'</div></div>').join(''):'<div class="coach">Hey! I’m your Momentum Coach. Tell me what you’re trying to improve, what’s getting in the way, or what happened today. I’ll help you break it into a realistic next step.\n\nI work offline using coaching logic, not a live AI model.</div>';return head('Your coach','Talk through a goal, challenge, or next step.')+'<div class="grid"><section class="card"><div class="sectionhead"><h2>Conversation</h2><button class="btn ghost small" id="clearChat">Clear</button></div><div id="chatLog">'+chat+'</div><label class="label">Message your coach</label><textarea class="field" id="question" rows="3" placeholder="For example: I keep putting off homework because..."></textarea><br><br><button class="btn" id="ask" style="width:100%">Send message</button><p class="muted" style="font-size:10px;margin-top:12px">Offline coach · Replies are generated on this device, not by a live AI.</p></section><section class="card"><h2>Try asking</h2><div class="list">'+['Help me make a routine','I keep procrastinating','I feel overwhelmed','How can I build confidence?','Help me set a goal'].map(x=>'<button class="item" data-topic="'+x+'">'+x+' <span>→</span></button>').join('')+'</div><h2 style="margin-top:20px">Your Momentum stats</h2><div class="stats"><div class="stat"><b>'+data.tasks.filter(t=>t.done).length+'</b><small>Tasks done</small></div><div class="stat"><b>'+data.workouts.length+'</b><small>Workouts</small></div><div class="stat"><b>'+data.focusSessions+'</b><small>Focus sessions</small></div></div><p class="muted" style="font-size:11px;margin-top:12px">The coach can use these app stats to make its suggestions more relevant.</p></section></div>'}
function advice(q){
 const s=String(q||'').toLowerCase();
 const done=data.tasks.filter(t=>t.done).length,total=data.tasks.length;
 const context="\n\nYour Momentum dashboard: "+done+"/"+total+" tasks completed, "+data.workouts.length+" workouts logged, and "+data.focusSessions+" focus sessions.";
 const has=(...words)=>words.some(w=>s.includes(w));
 if(/\b(hello|hey|hi)\b/.test(s))return "Hey! What would you like help with today? Tell me what is going on and I’ll help you choose a useful next step.";
 // Answer the user's main activity before broad words such as routine or habit.
 if(has("workout","exercise","fitness","strength training","gym","push-up","push up","squat","dumbbell")){
  return "Absolutely — let's make this about building strength safely, not trying to force your body to look a certain way.\n\nA simple beginner session for 2 non-consecutive days each week:\n1. Warm up with 5 minutes of easy walking or gentle movement.\n2. Do 1–2 comfortable sets of 6–10 chair or bodyweight squats.\n3. Do 1–2 sets of 6–10 wall push-ups.\n4. Do 1–2 sets of 6–10 bird-dogs, alternating sides.\n5. Finish with easy movement and give your body time to rest before the next strength session. Focus on smooth technique; stop if something hurts, and ask a trusted adult or qualified coach to check your form.\n\nEat regular meals and snacks, get enough sleep, and choose activities you enjoy. If you're worried about your growth or weight, talk with a parent/guardian and a healthcare professional.\n\nDo you have any equipment, or should I keep the routine bodyweight-only?"+context;
 }
 if(has("skinny","thin","underweight","gain weight","weight gain","can't gain weight","cant gain weight","body type","bigger")){

 return "I don't have enough context to give a useful answer yet. Could you tell me a little more about what you mean, what you want to change, or what you have already tried? I'll help break it into a next step."+context;

function weeklyReview(){

function makeDailyRoutine(){

 else steps.push('Check your top priority for today','Make progress on one important task','Take a break and do something you enjoy');

 else if(time==='medium')steps.push('Prepare what you need for tomorrow','Wind down before bed');
 else steps.push('Choose one small thing to prepare for tomorrow');
 const text='MY SAVED ROUTINE\n\nMorning\n• Get ready and have breakfast\n• '+steps[0]+'\n\nDaytime\n'+steps.slice(1,Math.max(2,steps.length-1)).map(x=>'• '+x).join('\n')+'\n\nEvening\n• '+steps[steps.length-1]+'\n\nThis routine is saved in Momentum. You can come back to it whenever you need it.';

}

a-habit-toggle]').forEach(b=>b.onclick=()=>{const h=data.habits.find(x=>x.id==b.dataset.habitToggle);if(!h)return;h.doneDates=Array.isArray(h.doneDates)?h.doneDates:[];const today=new Date().toLocaleDateString('en-CA');if(h.doneDates.includes(today))h.doneDates=h.doneDates.filter(d=>d!==today);else h.doneDates.push(today);save();render()});document.querySelectorAll('[data-habit-delete]').forEach(b=>b.onclick=()=>{data.habits=data.habits.filter(x=>x.id!=b.dataset.habitDelete);save();render();notify('Habit deleted')});let addHabit=document.getElementById('addHabit');if(addHabit)addHabit.onclick=()=>{const input=document.getElementById('habitName'),name=input.value.trim();if(!name){notify('Enter a habit name first');return}data.habits=data.habits||[];data.habits.push({id:Date.now(),name,doneDates:[]});save();render();notify('Habit added')};let rt=document.getElementById('todoReminderTime');if(rt)rt.onchange=()=>{data.todoReminderTime=rt.value;save();notify('Reminder time saved')};let en=document.getElementById('enableTodoNotifications');if(en)en.onclick=async()=>{if(!('Notification'in window)){notify('This browser does not support notifications');return}try{let permission=Notification.permission;if(permission!=='granted')permission=await Notification.requestPermission();if(permission==='granted'){data.todoNotifications=true;data.todoReminderTime=rt?rt.value:(data.todoReminderTime||'18:00');save();notify('Notifications enabled')}else notify('Please allow notifications in browser settings')}catch(e){notify('Could not enable notifications in this browser')}};let addTodo=document.getElementById('addTodo');if(addTodo)addTodo.onclick=()=>{let title=document.getElementById('todoTitle').value.trim();if(!title){notify('Enter a task first');return}data.todos.push({id:Date.now(),title,date:document.getElementById('todoDate').value,done:false});save();render();notify('Task added')};document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{let t=data.tasks.find(x=>x.id==b.dataset.task);t.done=!t.done;if(t.done){data.taskEvents=data.taskEvents||[];data.taskEvents.push({date:new Date().toLocaleDateString('en-CA'),title:t.title});xp(t.xp);notify('+'+t.xp+' XP earned')}save();render()});let add=document.getElementById('addTask');if(add)add.onclick=()=>{let title=prompt('What task do you want to add?');if(title&&title.trim()){data.tasks.push({id:Date.now(),title:title.trim(),detail:'Your custom task',xp:20,done:false});save();render()}};let habit=document.getElementById('habit');if(habit)habit.onclick=()=>go('habits');let sw=document.getElementById('saveWorkout');if(sw)sw.onclick=()=>{let name=document.getElementById('wname').value.trim();if(!name){notify('Add a workout name first');return}data.workouts.push({name,sets:Math.max(1,+document.getElementById('wsets').value||1),minutes:Math.max(1,+document.getElementById('wmins').value||1),date:new Date().toLocaleDateString(),iso:new Date().toISOString()});xp(15);save();notify('Workout saved · +15 XP');render()};document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{if(timer)clearInterval(timer);timer=null;data.focusMinutes=+b.dataset.min;seconds=data.focusMinutes*60;save();render()});let toggle=document.getElementById('toggle');if(toggle)toggle.onclick=()=>{if(timer){clearInterval(timer);timer=null;toggle.textContent='Resume';return}toggle.textContent='Pause';timer=setInterval(()=>{seconds--;let c=document.getElementById('clock');if(c)c.textContent=fmt(seconds);if(seconds<=0){clearInterval(timer);timer=null;data.focusSessions++;data.focusEvents=data.focusEvents||[];data.focusEvents.push({date:new Date().toLocaleDateString('en-CA'),minutes:data.focusMinutes});xp(20);save();notify('Focus session complete · +20 XP');render()}},1000)};let reset=document.getElementById('reset');if(reset)reset.onclick=()=>{if(timer)clearInterval(timer);timer=null;seconds=data.focusMinutes*60;render()};document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>coachAnswer(b.dataset.topic));let make=document.getElementById('makePlan');if(make)make.onclick=buildPlan;let makeRoutineBtn=document.getElementById('makeRoutine');if(makeRoutineBtn)makeRoutineBtn.onclick=makeDailyRoutine;let addGoal=document.getElementById('addGoal');if(addGoal)addGoal.onclick=()=>{const title=document.getElementById('goalTitle').value.trim(),target=Math.floor(+document.getElementById('goalTarget').value),unit=document.getElementById('goalUnit').value.trim()||'steps';if(!title){notify('Give your goal a name first');return}if(!Number.isFinite(target)||target<1){notify('Choose a target greater than zero');return}data.goals=data.goals||[];data.goals.push({id:Date.now(),title,target:Math.min(target,100000),unit,deadline:document.getElementById('goalDeadline').value,notes:document.getElementById('goalNotes').value.trim(),current:0,completed:false,createdAt:new Date().toISOString()});save();render();notify('Goal created')};document.querySelectorAll('[data-goal-save]').forEach(b=>b.onclick=()=>{const g=data.goals.find(x=>x.id==b.dataset.goalSave);if(!g)return;const v=Math.floor(+document.getElementById('goalProgress'+g.id).value);if(!Number.isFinite(v)||v<0){notify('Progress cannot be negative');return}g.current=Math.min(v,Math.max(1,+g.target||1));g.completed=g.current>=g.target;save();render();notify(g.completed?'Goal completed!':'Progress saved')});document.querySelectorAll('[data-goal-delete]').forEach(b=>b.onclick=()=>{data.goals=data.goals.filter(g=>g.id!=b.dataset.goalDelete);save();render();notify('Goal deleted')});let saveReview=document.getElementById('saveWeeklyReview');if(saveReview)saveReview.onclick=()=>{const now=new Date();now.setHours(0,0,0,0);now.setDate(now.getDate()-(now.getDay()+6)%7);const key=now.toLocaleDateString('en-CA');data.weeklyReviews=data.weeklyReviews||{};data.weeklyReviews[key]={wins:document.getElementById('reviewWins').value.trim(),challenge:document.getElementById('reviewChallenge').value.trim(),next:document.getElementById('reviewNext').value.trim(),upda function checkTodoReminders(){
 if(!data.todoNotifications||!('Notification'in window)||Notification.permission!=='granted')return;
 const now=new Date(),today=now.toLocaleDateString('en-CA'),time=now.toTimeString().slice(0,5);

 if(due.length){due.forEach(t=>t.dueNotice=t.date);save();new Notification('Momentum · Tasks due',{body:due.length===1?due[0].title:due.length+' tasks are due or overdue. Check your To-do list.'})}

  data.lastTodoDailyNotice=today;save();
  new Notification('Momentum · Daily reminder',{body:'You have '+pending.length+' unfinished task'+(pending.length===1?'':'s')+'. Open your To-do list to review them.'});
 }
}
